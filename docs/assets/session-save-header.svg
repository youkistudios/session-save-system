<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Session Save System</title>
  <desc id="desc">Four indexed session cards flow into a quiet local archive.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b1d"/><stop offset="1" stop-color="#123c3b"/></linearGradient><linearGradient id="tab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0ff8f"/><stop offset="1" stop-color="#82f4bd"/></linearGradient></defs>
  <rect width="1280" height="560" rx="32" fill="url(#bg)"/>
  <g transform="translate(76 76)"><text x="0" y="28" fill="#82f4bd" font-family="ui-monospace,monospace" font-size="18" letter-spacing="4">LOCAL MEMORY / PLAIN MARKDOWN</text><text x="0" y="126" fill="#f5f1df" font-family="Arial,sans-serif" font-size="78" font-weight="800">Save the state.</text><text x="0" y="206" fill="#f5f1df" font-family="Arial,sans-serif" font-size="78" font-weight="800">Keep the thread.</text><text x="4" y="258" fill="#a8c7c2" font-family="Arial,sans-serif" font-size="24">One session. One folder. One index row.</text></g>
  <g transform="translate(800 56) rotate(2)"><path d="M36 20h300l48 48v374H36z" fill="#f5f1df"/><path d="M336 20v48h48" fill="#cbd8ca"/><rect x="64" y="56" width="110" height="34" rx="17" fill="url(#tab)"/><text x="82" y="79" fill="#123c3b" font-family="ui-monospace,monospace" font-size="14" font-weight="700">_INDEX.md</text><g stroke="#9aada7" stroke-width="3"><path d="M68 130h278M68 181h278M68 232h278M68 283h278M68 334h278M68 385h278"/></g><g font-family="ui-monospace,monospace" font-size="18" font-weight="700"><text x="76" y="164" fill="#e45d3f">/st</text><text x="145" y="164" fill="#123c3b">NAME</text><text x="76" y="215" fill="#d59900">/ss</text><text x="145" y="215" fill="#123c3b">SAVE</text><text x="76" y="266" fill="#1b9c67">/ssum</text><text x="145" y="266" fill="#123c3b">CLOSE</text><text x="76" y="317" fill="#3268d4">/sa</text><text x="145" y="317" fill="#123c3b">REVIEW</text></g></g>
  <circle cx="1190" cy="76" r="18" fill="#f0ff8f"/><circle cx="1150" cy="500" r="10" fill="#e45d3f"/>
</svg>
